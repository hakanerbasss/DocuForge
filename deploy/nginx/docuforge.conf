# DocuForge web panel
#
# nginx yalnızca DOMAIN verildiğinde kurulur. İki işi var:
#
# 1. Panelin önüne kimlik doğrulama koymak. DocuForge'da giriş ekranı YOK —
#    /settings sayfası DeepSeek/Pexels/OpenAI anahtarlarını gösterir ve
#    değiştirir. Panel doğrudan internete açılırsa bu anahtarlar adresi bilen
#    herkese açıktır. Bootstrap'a PANEL_PASS verilirse aşağıdaki yer tutucuya
#    HTTP Basic Auth satırları yazılır.
#
# 2. HTTPS'i mümkün kılmak (SSL=1 + certbot). Bu sadece şıklık değil:
#    /settings'teki XTTS referans sesi TARAYICIDAN MİKROFONLA kaydedilebiliyor
#    ama MediaRecorder/getUserMedia yalnızca güvenli bağlamda (HTTPS ya da
#    localhost) çalışır. Düz HTTP'de o özellik hiç açılmaz.
#
# __*__ yer tutucularını bootstrap.sh dolduruyor.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Üretilen videolar ve yüklenen referans sesler buradan geçiyor.
    client_max_body_size 500M;

    __AUTH__

    location / {
        proxy_pass http://127.0.0.1:__PORT__;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bir video üretimi (araştırma + TTS + ffmpeg) dakikalarca sürebiliyor;
        # 60sn'lik varsayılan timeout uzun istekleri 504 ile keserdi.
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        proxy_buffering off;
    }
}

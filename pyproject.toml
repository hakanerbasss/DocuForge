[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "docuforge"
version = "0.1.0"
description = "AI-powered documentary production platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Hakan Erbaş"}
]

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
]

[project.scripts]
docuforge = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

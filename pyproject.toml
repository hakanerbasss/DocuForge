[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "docuforge"
version = "0.1.0"
description = "AI-powered documentary production platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Hakan Erbaş"}
]

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Web panel dependencies. These used to be listed only in the README as a
# manual "pip install fastapi uvicorn pydantic python-multipart" step, which
# meant a fresh `pip install -e .` produced a CLI that worked and a web panel
# that died on `import app.web` with ModuleNotFoundError. Install with:
#   pip install -e ".[web]"
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

# Supertonic (M1-M5 / F1-F5) is offered as a voice option in the wizard but was
# never declared anywhere — it is imported lazily inside the provider, so a box
# without it shows the option and then fails at generation time. Light enough to
# install by default (ONNX runtime, no torch).
voices = [
    "supertonic>=1.3.1",
]

# XTTS voice cloning. Deliberately separate: this pulls torch, which nothing
# else in DocuForge needs, and XTTS-v2 wants noticeably more RAM than the rest
# of the pipeline (see README).
xtts = [
    "coqui-tts",
    "torch",
    "torchaudio",
]

[project.scripts]
docuforge = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

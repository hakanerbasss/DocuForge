[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "docuforge"
version = "0.1.0"
description = "AI-powered documentary production platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Hakan Erbaş"}
]


[project.scripts]
docuforge = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
